# =========================================================================
# ADVANCED DEVSECOPS LOCAL GUARDRAILS PIPELINE (.pre-commit-config.yaml)
# =========================================================================

repos:
  # 1. TÍCH HỢP GITLEAKS (SECRETS SCANNING)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks
        name: Gitleaks (Secrets Scanner)
        description: Quét lỗ hổng rò rỉ mật khẩu, tokens nhạy cảm trước khi commit
        entry: gitleaks protect --verbose --staged

  # 2. TÍCH HỢP BỘ BA MÁY QUÉT HỆ THỐNG CỤC BỘ (LOCAL HOOKS)
  - repo: local
    hooks:
      # A. CHECKOV (IaC STATIC ANALYSIS)
      - id: checkov
        name: Checkov (IaC Config Scanner)
        description: Quét lỗi cấu hình an toàn cho K8s Manifests và Terraform
        entry: checkov
        language: system
        files: ^(01-os-hardening/.*\.tf|04-k8s-deployment/.*\.yaml)$
        args: [--quiet, --compact, -d, ., -f]

      # B. TRIVY (SCA DEPENDENCY SCANNER)
      - id: trivy-fs
        name: Trivy (SCA Dependency Scanner)
        description: Quét lỗ hổng bảo mật mã nguồn mở trong file requirements.txt
        entry: trivy fs
        language: system
        files: ^(03-app-security/requirements\.txt|04-k8s-deployment/.*\.yaml)$
        args: [--severity, HIGH,CRITICAL, --exit-code, "1", .]

      # C. OPA / CONFTEST (POLICY AS CODE GUARDRAIL)
      - id: conftest
        name: OPA / Conftest (Policy as Code Guardrail)
        description: Ép buộc tuân thủ các luật bảo mật Rego tự viết cho file YAML
        entry: conftest test
        language: system
        files: ^(04-k8s-deployment/apps/.*\.yaml)$
        args: [--policy, 04-k8s-deployment/guardrails/]